name: Release

# 推送 v* 标签时打包源码并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack source archives
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="ai-image-generator-${VERSION}/" -o "dist/ai-image-generator-${VERSION}-source.tar.gz" HEAD
          git archive --format=zip --prefix="ai-image-generator-${VERSION}/" -o "dist/ai-image-generator-${VERSION}-source.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
